name: CI

on:
  pull_request:
  push:

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: |
          go test -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run example builds
        run: |
          go test -tags examples ./...

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=5m

  docker-image-tests:
    runs-on: ubuntu-latest
    needs: go-test
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: |
          docker build -t hytale-session-token-broker:test .

      - name: Check image OS vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: hytale-session-token-broker:test
          version: v0.76.1
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
